<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Classic bold modern S -->
  <text x="45" y="82" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="88" text-anchor="middle" font-style="italic" fill="url(#redGrad)" filter="url(#shadow)">S</text>
  
  <!-- Classic Lightning Bolt overlapping -->
  <path d="M 80 15 L 50 50 L 65 50 L 45 90 L 85 45 L 65 45 Z" fill="url(#yellowGrad)" filter="url(#shadow)"/>
</svg>